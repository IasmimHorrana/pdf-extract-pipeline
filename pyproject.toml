[project]
name = "pdf-pipeline"
version = "0.1.0"
description = "Pipeline de engenharia de dados para processamento de arquivos PDF"
requires-python = ">=3.12"
dependencies = [
    "camelot-py>=0.11.0",
    "opencv-python>=4.9.0.80",
    "matplotlib>=3.8.3",
    "ghostscript>=0.7",
    "pandas>=2.2.2",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.32",
    "unidecode>=1.3.8",
    "pypdf2>=3.0.1",
    "schedule>=1.2.2",
    "pytz>=2024.2",
    "boto3>=1.35.29",
    "pydantic>=2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["I", "E", "F", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"